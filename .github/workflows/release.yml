name: Precompile NIFs

on:
  push:
    branches:
      # Always run on dev branch.
      - dev
    tags:
      # Tags will always run.
      - '*'
    paths:
      # Only build when code or dependencies change, not on checksum-only commits
      - 'lib/**'
      - 'native/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # we list the oldest OTP version that supports all features needed, have a look at the
        # erlang docs for the OTP version to see which NIF version is in which OTP release
        # https://github.com/erlang/otp/blob/master/erts/emulator/beam/erl_nif.h
        # - "2.15" # OTP 22, OTP 23
        # - "2.16" # OTP 24, OTP 25
        # - "2.17" # OTP 26
        nif: ["2.15"]
        job:
          # cranelift-codegen panics at 'error when identifying target: "no supported isa found for arch `arm`"'
          # - { target: arm-unknown-linux-gnueabihf , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-ios-sim, os: macos-15 }
          - { target: aarch64-apple-ios, os: macos-15 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true, cargo-args: "--no-default-features"}
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-ios, os: macos-15 }
          - { target: x86_64-pc-windows-gnu, os: windows-2022 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: x86_64-unknown-freebsd, os: ubuntu-22.04, use-cross: true, cross-version: v0.2.5 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract crate information
        shell: bash
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

          # Determine release tag: use git tag if present, otherwise use short commit SHA
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_TAG_RELEASE=true" >> $GITHUB_ENV
          else
            # Use short commit SHA for non-tag builds
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "RELEASE_TAG=${SHORT_SHA}" >> $GITHUB_ENV
            echo "IS_TAG_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Add target
        shell: bash
        run: |
          rustup target add ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}
          workspaces: |
            native/wasmex

      - name: Build the project
        id: build-crate
        uses: tessi/rustler-precompiled-action@main
        with:
          project-name: wasmex
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: ${{ matrix.job.cross-version || 'v0.2.4' }}
          project-dir: "native/wasmex"
          cargo-args: ${{ matrix.job.cargo-args }}

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.build-crate.outputs.file-path }}
          prerelease: ${{ env.IS_TAG_RELEASE != 'true' }}
        # Always publish for tags, and also for dev branch pushes
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'

  # Generate checksums and commit them back for SHA-based builds
  # This creates a new commit with the checksum file that users can reference
  checksum:
    name: Generate and commit checksums
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only run for non-tag builds (dev branch or manual dispatch)
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Get original commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "ORIGINAL_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksum file
        run: |
          # Generate checksums from the artifacts
          echo '%{' > checksum-Elixir.Wasmex.Native.exs

          # Find all .tar.gz files (not directories) in artifacts directory
          find artifacts -type f -name "*.tar.gz" | sort | while read -r filepath; do
            filename=$(basename "$filepath")
            checksum=$(sha256sum "$filepath" | awk '{print $1}')
            echo "  \"$filename\" => \"sha256:$checksum\"," >> checksum-Elixir.Wasmex.Native.exs
          done

          echo '}' >> checksum-Elixir.Wasmex.Native.exs

      - name: Commit and push checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksum-Elixir.Wasmex.Native.exs
          git diff --staged --quiet || git commit -m "Add checksums for artifacts from ${ORIGINAL_SHA} [skip ci]"
          git push
